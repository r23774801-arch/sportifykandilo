<script>
let isAdmin=false;
async function syncCommonHeader(){try{const r=await fetch('session.php?_='+Date.now(),{credentials:'same-origin',cache:'no-store'});const d=await r.json();const u=d?.user||{};isAdmin=!!d?.is_admin;const name=u?.nama_lengkap||u?.username||u?.nama||u?.name||(isAdmin?'admin':'User');const el=document.getElementById('headerUser');if(el)el.textContent=isAdmin?'admin':name;const prof=document.querySelector('.visitor-header-hidden');if(prof)prof.style.display=isAdmin?'flex':'none';}catch(e){const prof=document.querySelector('.visitor-header-hidden');if(prof)prof.style.display='none';}}
syncCommonHeader();const content=document.getElementById('content'),navText=document.getElementById('registerNavText');new MutationObserver(()=>{if(navText.textContent!=='Join Event')navText.textContent='Join Event'}).observe(navText,{childList:true});navText.textContent='Join Event';
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function fmtDate(v){if(!v)return '-';const d=new Date(v+'T00:00:00');return isNaN(d)?v:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
async function getSession(){const r=await fetch('session.php?_='+Date.now(),{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error('Belum login');return r.json()}
let crewOptions=[],registrationEvents=[];
function renderUser(){navText.textContent='Join Event';content.innerHTML=`<div class="card"><h1 class="title">Join Event</h1><p class="subtitle">Pilih nama yang sudah terdaftar di Crew, lalu pilih event yang ingin diikuti.</p><form id="registerForm"><div class="grid"><div class="field full"><label for="crew_search">Nama Crew <span style="color:#dc2626">*</span></label><div class="combo"><input id="crew_search" type="text" autocomplete="off" placeholder="Ketik atau pilih nama Crew..." aria-autocomplete="list" aria-controls="crew_options" aria-expanded="false"><input id="crew_id" name="crew_id" type="hidden"><button class="combo-toggle" id="crewToggle" type="button" aria-label="Buka daftar Crew"><i class="fa-solid fa-chevron-down"></i></button><div class="combo-list" id="crew_options" role="listbox" hidden></div></div><div class="hint">Belum terdaftar? Daftarkan data melalui menu Crew.</div></div><div class="field full"><label for="event_search">Pilih Event <span style="color:#dc2626">*</span></label><div class="combo"><input id="event_search" type="text" autocomplete="off" placeholder="Ketik atau pilih nama event..." aria-autocomplete="list" aria-controls="event_options" aria-expanded="false"><input id="event_id" name="event_id" type="hidden"><button class="combo-toggle" id="eventToggle" type="button" aria-label="Buka daftar event"><i class="fa-solid fa-chevron-down"></i></button><div class="combo-list" id="event_options" role="listbox" hidden></div></div><div class="hint">Semua event tersedia, termasuk event yang sudah selesai.</div><div class="event-preview" id="eventPreview"></div></div></div><div class="event-note"><i class="fa-solid fa-circle-info"></i> Setelah kamu mengirim permintaan join, statusnya <b>Menunggu Persetujuan</b>.</div><div class="actions"><button class="btn primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Join Event</button><a class="btn outline" href="index.html">Kembali</a></div><div id="status" class="status"></div></form></div>`;loadJoinData();document.getElementById('registerForm').addEventListener('submit',submitRegistration);setupCrewCombo();setupEventCombo()}
async function loadJoinData(){try{const [cr,er]=await Promise.all([fetch('api.php?action=get_crew_options&_='+Date.now(),{cache:'no-store'}),fetch('api.php?action=get_registration_events&_='+Date.now(),{cache:'no-store'})]);crewOptions=await cr.json();registrationEvents=await er.json();if(!cr.ok||!Array.isArray(crewOptions))throw new Error(crewOptions.message||'Daftar Crew gagal dimuat.');if(!er.ok||!Array.isArray(registrationEvents))throw new Error(registrationEvents.message||'Event gagal dimuat.');renderCrewOptions('');renderEventOptions('')}catch(e){const s=document.getElementById('status');if(s){s.className='status error';s.textContent='✕ '+e.message}}}
function setupCrewCombo(){const input=document.getElementById('crew_search'),list=document.getElementById('crew_options');const open=()=>{list.hidden=false;input.setAttribute('aria-expanded','true');renderCrewOptions(input.value)};input.addEventListener('focus',open);input.addEventListener('input',()=>{document.getElementById('crew_id').value='';open()});document.getElementById('crewToggle').addEventListener('click',()=>list.hidden?open():(list.hidden=true));document.addEventListener('click',e=>{if(!e.target.closest('.combo')){list.hidden=true;input.setAttribute('aria-expanded','false')}})}
function renderCrewOptions(query){const list=document.getElementById('crew_options');if(!list)return;const q=(query||'').toLowerCase().trim();const rows=crewOptions.filter(c=>(c.nama_lengkap+' '+(c.alias_nama||'')+' '+(c.jabatan||'')).toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(c=>`<button type="button" class="combo-option" role="option" data-id="${c.id}">${c.foto_path?`<img src="${esc(c.foto_path)}" alt="">`:'<span style="width:36px;height:36px;border-radius:9px;background:#f1f5f9;display:grid;place-items:center"><i class="fa-solid fa-user"></i></span>'}<span><b>${esc(c.nama_lengkap)}</b><small>${esc(c.alias_nama||c.jabatan||'Crew')}</small></span></button>`).join(''):'<div class="combo-empty">Nama Crew tidak ditemukan.</div>';list.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{const c=crewOptions.find(x=>String(x.id)===b.dataset.id);document.getElementById('crew_id').value=b.dataset.id;document.getElementById('crew_search').value=c.nama_lengkap;list.hidden=true}))}
function setupEventCombo(){const input=document.getElementById('event_search'),list=document.getElementById('event_options');const open=()=>{list.hidden=false;input.setAttribute('aria-expanded','true');renderEventOptions(input.value)};input.addEventListener('focus',open);input.addEventListener('input',()=>{document.getElementById('event_id').value='';renderEventPreview();open()});document.getElementById('eventToggle').addEventListener('click',()=>list.hidden?open():(list.hidden=true));document.addEventListener('click',e=>{if(!e.target.closest('#event_search')&&!e.target.closest('#eventToggle')&&!e.target.closest('#event_options')){list.hidden=true;input.setAttribute('aria-expanded','false')}})}
function renderEventOptions(query){const list=document.getElementById('event_options');if(!list)return;const q=(query||'').toLowerCase().trim();const rows=registrationEvents.filter(e=>(e.nama_event+' '+(e.status||'')+' '+fmtDate(e.tanggal_pelaksanaan)).toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(e=>`<button type="button" class="combo-option" role="option" data-event-id="${e.id}" style="padding:11px">${e.logo_event?`<img src="${esc(e.logo_event)}" alt="Logo ${esc(e.nama_event)}" style="width:48px;height:48px;object-fit:contain;background:#fff">`:'<span style="width:48px;height:48px;flex:0 0 48px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;color:#64748b"><i class="fa-solid fa-trophy"></i></span>'}<span style="min-width:0"><b style="display:block;font-size:14px;color:#1f2937">${esc(e.nama_event)}</b><small style="display:block;margin-top:4px;color:#667085">${fmtDate(e.tanggal_pelaksanaan)} • ${esc(e.status||'Tanpa status')}</small></span><span style="margin-left:auto;padding:4px 8px;border-radius:999px;background:${String(e.status).toLowerCase()==='selesai'?'#dcfce7':'#fff7d6'};color:${String(e.status).toLowerCase()==='selesai'?'#166534':'#92400e'};font-size:10px;font-weight:800">${esc(e.status||'Event')}</span></button>`).join(''):'<div class="combo-empty">Event tidak ditemukan.</div>';list.querySelectorAll('[data-event-id]').forEach(b=>b.addEventListener('click',()=>{const e=registrationEvents.find(x=>String(x.id)===b.dataset.eventId);document.getElementById('event_id').value=b.dataset.eventId;document.getElementById('event_search').value=e.nama_event;list.hidden=true;document.getElementById('event_search').setAttribute('aria-expanded','false');renderEventPreview()}))}
function renderEventPreview(){const id=document.getElementById('event_id').value,p=document.getElementById('eventPreview'),e=registrationEvents.find(x=>String(x.id)===String(id));if(!e){p.className='event-preview';p.innerHTML='';return}p.className='event-preview show';p.innerHTML=`${e.logo_event?`<img src="${esc(e.logo_event)}" alt="Logo ${esc(e.nama_event)}" style="object-fit:contain">`:'<span style="width:64px;height:64px;border-radius:12px;background:#e2e8f0;display:grid;place-items:center"><i class="fa-solid fa-trophy"></i></span>'}<span><b>${esc(e.nama_event)}</b><small>${fmtDate(e.tanggal_pelaksanaan)} • ${esc(e.status||'Tanpa status')}</small></span>`}
async function submitRegistration(e){e.preventDefault();const form=e.target,status=document.getElementById('status');if(!document.getElementById('crew_id').value){status.className='status error';status.textContent='✕ Pilih nama dari daftar Crew.';return}if(!document.getElementById('event_id').value){status.className='status error';status.textContent='✕ Pilih event dari daftar.';return}status.className='status info';status.textContent='Mengirim permintaan join...';const fd=new FormData(form);try{const r=await fetch('api.php?action=register_event',{method:'POST',body:fd,credentials:'same-origin'});const d=await r.json();if(!r.ok||d.status==='error')throw new Error(d.message||'Pendaftaran gagal.');status.className='status success';status.innerHTML='✓ Berhasil join <b>'+esc(d.event)+'</b>. Tunggu persetujuan Admin.';form.reset();renderEventPreview()}catch(err){status.className='status error';status.textContent='✕ '+(err.message||'Pendaftaran gagal.')}}
function statusBadge(s){const cls=s==='Disetujui'?'approved':s==='Ditolak'?'rejected':'pending';return `<span class="badge ${cls}">${esc(s||'Menunggu')}</span>`}
async function loadAdminRegistrations(){navText.textContent='Registrasi Akun';content.innerHTML=`<div class="card"><div class="admin-head"><div><h1 class="title">Registrasi Akun</h1><p class="subtitle">Daftar pendaftar yang masuk dari menu Gabung. Admin dapat menyetujui atau menolak pendaftaran.</p></div><button class="btn primary" onclick="loadAdminRegistrations()"><i class="fa-solid fa-rotate"></i> Refresh</button></div><div id="regArea" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat pendaftaran...</div></div>`;try{const r=await fetch('api.php?action=get_registrations&_='+Date.now(),{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||d.status==='error')throw new Error(d.message||'Data pendaftaran gagal dimuat.');const area=document.getElementById('regArea');if(!d.length){area.innerHTML='<div class="empty"><i class="fa-solid fa-user-plus" style="font-size:35px;margin-bottom:10px"></i><br>Belum ada pendaftaran dari User.</div>';return}const waiting=d.filter(x=>x.status==='Menunggu').length;area.innerHTML=`<div class="count">Total pendaftar: <b>${d.length}</b> &nbsp;•&nbsp; Menunggu persetujuan: <b>${waiting}</b></div><div class="table-wrap"><table class="user-table"><thead><tr><th>Foto</th><th>Nama</th><th>Alias</th><th>Instagram</th><th>WhatsApp</th><th>Jabatan</th><th>Event</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead><tbody>${d.map(r=>`<tr><td><div class="photo-wrap"><img class="avatar" src="${esc(r.foto_path)}" alt="Foto ${esc(r.nama_lengkap)}"></div></td><td><b>${esc(r.nama_lengkap)}</b></td><td>${esc(r.alias_nama||'-')}</td><td>${esc(r.instagram||'-')}</td><td>${esc(r.whatsapp)}</td><td><b>${esc(r.jabatan||'-')}</b></td><td><b>${esc(r.nama_event||'Event dihapus')}</b><br><span style="font-size:11px;color:#667085">${fmtDate(r.tanggal_pelaksanaan)}</span></td><td>${statusBadge(r.status)}</td><td>${fmtDate((r.created_at||'').slice(0,10))}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap">${r.status!=='Disetujui'?`<button class="small-btn approve" onclick="setRegStatus(${r.id},'Disetujui')"><i class="fa-solid fa-check"></i> Setujui</button>`:''}${r.status!=='Ditolak'?`<button class="small-btn reject" onclick="setRegStatus(${r.id},'Ditolak')"><i class="fa-solid fa-xmark"></i> Tolak</button>`:''}<button class="small-btn del" onclick="deleteRegistration(${r.id})"><i class="fa-solid fa-trash"></i></button></div></td></tr>`).join('')}</tbody></table></div>`}catch(e){const area=document.getElementById('regArea');if(area)area.innerHTML=`<div class="error-box"><b>Gagal memuat pendaftaran.</b><br>${esc(e.message)}<br><button class="btn primary" style="margin-top:10px" onclick="loadAdminRegistrations()">Coba Lagi</button></div>`}}
async function setRegStatus(id,status){if(status==='Disetujui'&&!confirm('Setujui pendaftaran ini?'))return;if(status==='Ditolak'&&!confirm('Tolak pendaftaran ini?'))return;try{const r=await fetch('api.php?action=update_registration_status',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id,status})});const d=await r.json();if(!r.ok||d.status==='error')throw new Error(d.message||'Gagal mengubah status.');loadAdminRegistrations()}catch(e){alert(e.message)}}
async function deleteRegistration(id){if(!confirm('Hapus data pendaftaran ini?'))return;try{const r=await fetch('api.php?action=delete_registration',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id})});const d=await r.json();if(!r.ok||d.status==='error')throw new Error(d.message||'Gagal menghapus.');loadAdminRegistrations()}catch(e){alert(e.message)}}
(async()=>{try{const s=await getSession();isAdmin=!!s.is_admin;document.body.classList.toggle('body-guest',!isAdmin);if(isAdmin)await loadAdminRegistrations();else renderUser()}catch(e){isAdmin=false;document.body.classList.add('body-guest');renderUser()}})();
</script>
